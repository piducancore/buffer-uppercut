name: Unsigned preview candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag matching the crate version, for example v0.1.0-preview.1
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/check-notices.test.mjs
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev
      - name: Verify tag matches crate version
        run: |
          crate_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; data=json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "buffer-uppercut"))')"
          test "$RELEASE_TAG" = "v$crate_version"
          case "$crate_version" in
            *-preview.*) ;;
            *) echo "Unsigned workflow accepts preview versions only"; exit 1 ;;
          esac
      - name: Require reviewed release inputs
        run: |
          test -s "docs/releases/${RELEASE_TAG#v}.md"
          test -s docs/releases/THIRDPARTY.json
          test -s docs/releases/APPROVED.txt
          grep -Fx "$RELEASE_TAG" docs/releases/APPROVED.txt
          node tools/check-notices.mjs docs/releases/THIRDPARTY.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --features rt-paranoid

  build:
    needs: verify
    name: Build ${{ matrix.slug }} candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            slug: windows-x64
          - os: macos-14
            slug: macos

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            zip
      - name: Install TRUCE build tool
        run: cargo install cargo-truce --version 6.3.0 --locked
      - name: Build CLAP and VST3
        run: cargo truce build --clap --vst3
      - name: Install clap-validator
        run: cargo install --git https://github.com/free-audio/clap-validator --locked
      - name: Install pluginval 1.0.4
        run: |
          case "$RUNNER_OS" in
            Linux) asset=pluginval_Linux.zip ;;
            macOS) asset=pluginval_macOS.zip ;;
            Windows) asset=pluginval_Windows.zip ;;
          esac
          mkdir -p target/tools/pluginval
          curl --fail --location --retry 3 \
            "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$asset" \
            --output target/tools/pluginval.zip
          unzip -q target/tools/pluginval.zip -d target/tools/pluginval
          pluginval="$(find target/tools/pluginval -type f \( -name pluginval -o -name pluginval.exe \) -print -quit)"
          test -n "$pluginval"
          chmod +x "$pluginval"
          dirname "$pluginval" >> "$GITHUB_PATH"
      - name: Validate exact release bundles
        run: |
          cargo truce install --clap --vst3 --no-build
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo truce validate --pluginval --skip-gui-tests
            clap-validator validate "target/bundles/Buffer Uppercut.clap"
          else
            cargo truce validate --clap --pluginval --skip-gui-tests
          fi
      - name: Check third-party notice baseline
        run: |
          cargo install cargo-bundle-licenses --version 4.2.0 --locked
          cargo bundle-licenses --format json --output target/THIRDPARTY-discovered.json
          node tools/check-notices.mjs \
            docs/releases/THIRDPARTY.json target/THIRDPARTY-discovered.json
      - name: Stage plugin bundles
        run: |
          mkdir -p "dist/Buffer Uppercut"
          cp -R "target/bundles/Buffer Uppercut.clap" "dist/Buffer Uppercut/"
          cp -R "target/bundles/Buffer Uppercut.vst3" "dist/Buffer Uppercut/"
          cp LICENSE "dist/Buffer Uppercut/"
          cp docs/RELEASE-INSTALL.txt "dist/Buffer Uppercut/INSTALL.txt"
          cp docs/releases/THIRDPARTY.json "dist/Buffer Uppercut/"
          cp "docs/releases/${RELEASE_TAG#v}.md" "dist/Buffer Uppercut/RELEASE-NOTES.md"
      - name: Package macOS candidate
        if: runner.os == 'macOS'
        run: |
          archive="Buffer-Uppercut-${RELEASE_TAG#v}-${{ matrix.slug }}-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Buffer Uppercut" "dist/$archive"
      - name: Package Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $archive = "dist/Buffer-Uppercut-$version-${{ matrix.slug }}-unsigned.zip"
          Compress-Archive -Path "dist/Buffer Uppercut" -DestinationPath $archive
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: dist/*-unsigned.zip
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: (cd dist && sha256sum *-unsigned.zip > SHA256SUMS)
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --draft \
              --prerelease \
              --notes-file "docs/releases/${RELEASE_TAG#v}.md" \
              --title "Buffer Uppercut ${RELEASE_TAG#v} — Unsigned preview" \
              --verify-tag
          fi
